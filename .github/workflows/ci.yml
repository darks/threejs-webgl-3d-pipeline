name: Validate package and demos
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-checks
          path: |
            artifacts/smoke/
            artifacts/standalone/checks.json
            artifacts/standalone/*.png
          if-no-files-found: ignore
